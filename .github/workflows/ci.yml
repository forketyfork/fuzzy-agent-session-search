name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  security-events: write
  actions: read

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    env:
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache
      ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache/local
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cache Zig build cache
        uses: actions/cache@v6
        with:
          path: .zig-cache
          key: zig-${{ runner.os }}-${{ hashFiles('build.zig', 'build.zig.zon', 'src/**', 'test/**', 'flake.lock') }}
          restore-keys: |
            zig-${{ runner.os }}-

      - name: Cache Nix store
        uses: cachix/cachix-action@v17
        with:
          name: forketyfork
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Build, test, lint
        run: |
          for i in 1 2 3; do
            nix develop --accept-flake-config --command just ci && break
            if [ $i -eq 3 ]; then exit 1; fi
            sleep 5
          done

  sarif:
    runs-on: ubuntu-latest
    needs: build-test-lint
    env:
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache
      ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache/local
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cache Zig build cache
        uses: actions/cache@v6
        with:
          path: .zig-cache
          key: zig-${{ runner.os }}-${{ hashFiles('build.zig', 'build.zig.zon', 'src/**', 'test/**', 'flake.lock') }}
          restore-keys: |
            zig-${{ runner.os }}-

      - name: Cache Nix store
        uses: cachix/cachix-action@v17
        with:
          name: forketyfork
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Run zwanzig (SARIF)
        run: nix develop --accept-flake-config --command zig build lint-sarif > results.sarif || true

      - uses: github/codeql-action/upload-sarif@v4.37.9
        with:
          sarif_file: results.sarif
